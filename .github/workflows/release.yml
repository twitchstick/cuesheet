name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Take the notes for this version from the changelog
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No changelog entry for $version — using a placeholder." >&2
            echo "See the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > notes.md
          fi
          {
            echo
            echo '## Running this version'
            echo
            echo '```sh'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/cuesheet:${version}"
            echo '```'
            echo
            echo "On Unraid, use *Check for Updates* on the Cuesheet container, or import the [template](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/unraid/cuesheet.xml)."
          } >> notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "Cuesheet $GITHUB_REF_NAME" --notes-file notes.md
