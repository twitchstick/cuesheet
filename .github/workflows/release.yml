name: Publish release

# Two ways to cut a release:
#   1. Push a tag:  git tag -a v1.2.3 -m "..." && git push origin v1.2.3
#      The image build runs from docker.yml and this workflow publishes the notes.
#   2. Run this workflow from the Actions tab with a version number.
#      It creates the tag, builds the image for that version, and publishes.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the leading v (e.g. 1.2.3)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$version' is not a semantic version like 1.2.3"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Take the notes for this version from the changelog
        run: |
          awk -v v="${{ steps.v.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "See the [changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." > notes.md
          fi
          {
            echo
            echo '## Running this version'
            echo
            echo '```sh'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/cuesheet:${{ steps.v.outputs.version }}"
            echo '```'
            echo
            echo "On Unraid, use **Check for Updates** on the Cuesheet container, or import the [template](https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/unraid/cuesheet.xml)."
          } >> notes.md

      # Only when releasing from the Actions tab: a tag push already built the image.
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'workflow_dispatch'

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image for this version
        if: github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cuesheet:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/cuesheet:${{ steps.v.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/cuesheet:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "Cuesheet ${{ steps.v.outputs.tag }}" \
            --notes-file notes.md
