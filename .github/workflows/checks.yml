name: Checks

# Reusable -- called by docker.yml as the gate before an image is built or
# pushed (on every push to main and every pull request). Not meant to be
# run directly.
on:
  workflow_call:

jobs:
  test:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      # e2e/*.ts has no other type-checking gate: playwright.config.ts's
      # testDir runs specs through esbuild, which strips types without
      # checking them, and client/tsconfig.json's include is scoped to
      # client/src. tsc --noEmit against e2e/tsconfig.json here is the only
      # thing that would catch a type error under e2e/ before Playwright
      # hits it at runtime.
      - run: npm run typecheck:e2e

  typecheck-and-build:
    name: Typecheck + client build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      # tsc --noEmit (strict, noUnusedLocals/noUnusedParameters) then vite
      # build -- one command covers both "typecheck" and "build".
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 1

  e2e:
    name: Playwright (desktop + mobile)
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: client/dist
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npm audit --audit-level=high

  windows:
    # Every OS-path assumption in this repo (server/index.js's own-module
    # check, e2e/fixture-server.mjs's dynamic import of it) has historically
    # broken silently on Windows and passed every one of the Linux jobs
    # above without a single failure. This is the only job that would
    # actually catch that class of regression again.
    name: Server tests + fixture-server smoke (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npm run build
      # Not the full Playwright suite -- just proves e2e/fixture-server.mjs's
      # own dynamic import() of server/index.js (built from a Windows path)
      # actually resolves and the server comes up, which is the exact line
      # that used to throw on this OS before pathToFileURL() fixed it.
      - name: Fixture server comes up
        shell: bash
        run: |
          node e2e/fixture-server.mjs &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "fixture server never came up" >&2
          exit 1
